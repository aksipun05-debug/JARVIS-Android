name: Build JARVIS APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Create build directories
        run: |
          mkdir -p build/classes
          mkdir -p build/generated
          mkdir -p build/apk

      - name: Compile Java
        run: |
          javac \
            -source 8 \
            -target 8 \
            -classpath "$ANDROID_HOME/platforms/android-35/android.jar" \
            -d build/classes \
            app/src/main/java/com/jarvis/ai/MainActivity.java

      - name: Create DEX
        run: |
          $ANDROID_HOME/build-tools/35.0.0/d8 \
            --output build/dex \
            build/classes/com/jarvis/ai/MainActivity.class

      - name: Create APK
        run: |
          $ANDROID_HOME/build-tools/35.0.0/aapt2 compile \
            --dir app/src/main/res \
            -o build/resources.zip

          $ANDROID_HOME/build-tools/35.0.0/aapt2 link \
            -o build/apk/JARVIS-unsigned.apk \
            -I "$ANDROID_HOME/platforms/android-35/android.jar" \
            --manifest app/src/main/AndroidManifest.xml \
            build/resources.zip

      - name: Add DEX to APK
        run: |
          cd build/dex
          zip -q ../apk/JARVIS-unsigned.apk classes.dex

      - name: Create debug key
        run: |
          keytool -genkeypair \
            -keystore build/debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Sign APK
        run: |
          $ANDROID_HOME/build-tools/35.0.0/apksigner sign \
            --ks build/debug.keystore \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out build/apk/JARVIS.apk \
            build/apk/JARVIS-unsigned.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-APK
          path: build/apk/JARVIS.apk
